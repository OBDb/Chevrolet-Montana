generations:
  - name: "First Generation"
    start_year: 2003
    end_year: 2011
    description: "The original Chevrolet Montana (sold as the Tornado in some markets like Mexico, and as the Opel Corsa Utility or Chevrolet Corsa Utility in South Africa) was a small unibody coupé utility developed primarily for Latin American markets. Based on the Opel Corsa C platform, it featured a front-wheel drive layout with a transverse engine, unusual for a pickup truck. Available only in a single cab configuration with a short bed, it was powered by small displacement engines: 1.4L and 1.8L petrol engines, and a 1.7L diesel in South African markets. The interior was basic and car-like, sharing many components with the Corsa. Manufactured in São José dos Campos, Brazil and assembled in Port Elizabeth, South Africa, this generation established the Montana as an economical, light-duty urban pickup for markets where small, affordable commercial vehicles were in demand, particularly Brazil and other South American countries."

  - name: "Second Generation"
    start_year: 2010
    end_year: 2021
    description: "The second-generation Montana was based on the Chevrolet Agile platform, representing an evolution of the previous generation's unibody architecture. It featured more modern styling with a more prominent grille and sculptured body lines while maintaining front-wheel drive and single cab configuration. Engine options included a 1.4L EconoFlex petrol engine and a 1.3L Multijet diesel. The interior saw upgrades in design and technology, though it remained relatively basic compared to passenger cars of the same era. Production in Brazil began in 2010 under the main nameplate, while South Africa received the Chevrolet Utility variant from 2012 to 2017. In Mexico, it continued as the Tornado until 2020. This generation served primarily as an affordable, efficient utility vehicle for small businesses and buyers needing occasional cargo capability without the size and cost of traditional pickups."

  - name: "Third Generation"
    start_year: 2023
    end_year: null
    description: "The third-generation Montana, introduced in December 2022, represents a significant departure from its predecessors, evolving from a small car-based pickup to a more substantial compact pickup truck. Built on the GM VSS-F (JCXX) platform shared with the Chevrolet Trax, it features a four-door crew cab design—a first for the Montana nameplate. Power comes from a 1.2-liter turbocharged three-cylinder engine producing 133 HP, paired with either a six-speed manual or automatic transmission, maintaining a front-wheel drive layout. The exterior design incorporates modern Chevrolet styling elements with a more rugged appearance suitable for its pickup classification. The interior is significantly more advanced than previous generations, featuring standard infotainment systems and contemporary safety technology. The compact cargo bed offers innovative storage solutions. Manufactured at São Caetano do Sul, Brazil, this generation transforms the Montana from a basic utility vehicle to a more versatile lifestyle pickup, targeting Latin American markets with plans for wider global distribution."
